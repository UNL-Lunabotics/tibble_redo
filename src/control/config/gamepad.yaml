joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy:
  ros__parameters:
    axis_linear:
      x: 1  # forward/back
    axis_angular:
      yaw: 3  # Turn
    scale_linear:
      x: 1.0
    scale_angular:
      yaw: 1.0

    deadzone: 0.5

    # enable_button: 4
    # enable_turbo_button: 5
    
    require_enable_button: false
    publish_stamped_twist: true