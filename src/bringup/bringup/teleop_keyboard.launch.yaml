%YAML 1.2
---
launch:
  - node:
      pkg: teleop_twist_keyboard
      exec: teleop_twist_keyboard
      name: teleop_twist_keyboard
      args: --ros-args -p stamped:=true -r cmd_vel:=cmd_vel_keyboard
      launch-prefix: "bash -c 'exec \"$@\" < /dev/tty' --"
      emulate_tty: true
      output: screen