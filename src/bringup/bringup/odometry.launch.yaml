%YAML 1.2
---
launch:
  # MOLA LiDAR Odometry
  - include:
      file: "$(find-pkg-share mola_lidar_odometry)/ros2-launchs/ros2-lidar-odometry.launch.py"
      arg:
        - name: "lidar_topic_name"
          value: "/scan"
        - name: "lidar_topic_type"
          value: "LaserScan"
        - name: "mola_lo_pipeline"
          value: "$(find-pkg-share mola_lidar_odometry)/pipelines/lidar2d.yaml"
        - name: "ignore_lidar_pose_from_tf"
          value: "False"
        - name: "publish_localization_following_rep105"
          value: "True"
