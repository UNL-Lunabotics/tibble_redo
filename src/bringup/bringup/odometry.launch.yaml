%YAML 1.2
---
launch:
  - group:
      # Remap MOLA's Odometry output
      - set_remap:
          from: "/lidar_odometry/pose"
          to: "/odom"

      - include:
          file: "$(find-pkg-share mola_lidar_odometry)/ros2-launchs/ros2-lidar-odometry.launch.py"
          arg:
            # LiDAR
            - name: "lidar_topic_name"
              value: "/scan"
            - name: "lidar_topic_type"
              value: "LaserScan"

            # IMU
            - name: "imu_topic_name"
              value: "/imu/out"
            - name: "use_imu_for_lio"
              value: "True"

            # Pipeline
            - name: "mola_lo_pipeline"
              value: "$(find-pkg-share mola_lidar_odometry)/pipelines/lidar2d.yaml"

            # TF
            - name: "mola_lo_reference_frame"
              value: "odom"

            # Internal local mapping
            - name: "start_mapping_enabled"
              value: "True"
            - name: "publish_local_map"
              value: "False"

            # Sensor transforms
            - name: "ignore_lidar_pose_from_tf"
              value: "False"
            - name: "ignore_imu_pose_from_tf"
              value: "False"

            # GUI
            - name: "use_rviz"
              value: "False"
            - name: "use_mola_gui"
              value: "False"

            # Simulation
            - name: "use_sim_time"
              value: "$(var use_sim)"

            # Unneeded Topics
            - name: "gnss_topic_name"
              value: ""
            - name: "gpsfix_topic_name"
              value: ""
