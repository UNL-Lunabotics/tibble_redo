%YAML 1.2
---
launch:
  - arg:
      name: "robot_name"
      default: "robot"
  - arg:
      name: "camera_name"
      default: "camera"

  - node:
      pkg: realsense2_camera
      exec: realsense2_camera_node
      name: "$(var camera_name)"
      param:
        - name: enable_gyro
          value: true
        - name: enable_accel
          value: true
        - name: enable_depth
          value: true
        - name: enable_color
          value: true
        - name: unite_imu_method
          value: 2   # 0=none, 1=copy, 2=linear_interpolation

        # Increase shutter speed to reduce motion blur in the AprilTag image.
        - name: rgb_camera.color_profile
          value: "424x240x60"
        - name: rgb_camera.enable_auto_exposure
          value: false
        - name: rgb_camera.auto_exposure_priority
          value: false
        - name: rgb_camera.exposure
          value: 300
        - name: rgb_camera.gain
          value: 128
